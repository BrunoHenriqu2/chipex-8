<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/css/style.css">
    <link rel="stylesheet" href="/public/css/index.css">
    <title>Chipex-8</title>
</head>

<body>
    <header>
        <h1>Chipex-8</h1>
        <div>
            <nav id="chipex-nav" class="chipex-nav-opened">
                <div class="chipex-nav-scope">
                    <button id="chipex-nav-button">
                        <img src="/public/img/nav.svg" class="s-color-filter" alt="nav" height="26" width="26">
                    </button>
                </div>
                <div class="chipex-nav-items">
                    <ul>
                        <li id="games-li" class="li-selected"><a href="index.html">
                                <span class="li-text">Games</span>
                                <img src="/public/img/controller.svg" alt="" class="li-icon s-color-filter">
                            </a></li>
                        <li id="config-li"><a href="config.html">
                                <span class="li-text">Configurations</span>
                                <img src="/public/img/gear.svg" alt="" class="li-icon s-color-filter">
                            </a></li>
                        <li id="credits-li"><a href="credits.html">
                                <span class="li-text">Credits</span>
                                <span class="li-icon center" style="font-size: 24pt;">&copy;</span>
                            </a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <article>
            <section id="search" class="center margin-1">
                <label id="search-bar" for="search-input" class="center">
                    <img src="/public/img/magnifier.svg" width="20" height="20">
                    <input type="text" name="" id="search-input" placeholder="search for games">
                </label>
            </section>
            <section id="games" class="center margin-1">
                <div class="game">
                    <button style="background-image: url('/chip-8/img/FlightRunner.png');">
                        <!-- <img src="/src/games-img/FlightRunner.png" alt=""> -->
                        <figcaption>Flight Runner</figcaption>
                    </button>
                </div>
            </section>
        </article>
    </main>
    <footer>
        <span class="center">powered by <img height="50" width="60"
                src="https://res.cloudinary.com/dxyktq9kw/image/upload/v1751423666/BH2-4-white-mini_jbymz1.svg"
                alt="bh2-logo"></span>
    </footer>
    <script type="module" src="/public/js/index.js"></script>
</body>

</html>
